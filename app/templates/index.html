<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>

        <form action="/calculate" method="post" class="calc-form">
            <input type="text" inputmode="decimal" name="num1" placeholder="First number" required>

            <select name="op" required>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>

            <input type="text" inputmode="decimal" name="num2" placeholder="Second number">

            <button type="submit">=</button>
        </form>

        {% if entries %}
            <div class="latest-result">
                Result: <strong>{{ entries[-1].result }}</strong>
            </div>
        {% endif %}

        <div class="history-header">
            <h2>History</h2>
            {% if entries %}
                <form action="/clear" method="post">
                    <button type="submit" class="clear-btn">Clear</button>
                </form>
            {% endif %}
        </div>

        {% if entries %}
            <ul class="history-list">
                {% for entry in entries %}
                    <li>
                        <span>{{ entry.expression }}</span>
                        <form action="/delete/{{ entry.id }}" method="post">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty-msg">No calculations yet.</p>
        {% endif %}
    </div>
</body>
</html>
