<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>

        <form class="calc-form" onsubmit="event.preventDefault();">
            <input type="number" step="any" placeholder="First number" required>

            <select required>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value=""></option>
                <option value="/">/</option>
            </select>

            <input type="number" step="any" placeholder="Second number" required>

            <button type="submit">=</button>
        </form>

        <h2>History</h2>
        <ul class="history-list">
            <li>5 + 3 = 8</li>
            <li>12 * 4 = 48</li>
            <li>10 / 2 = 5.0</li>
        </ul>
    </div>
</body>
</html>
