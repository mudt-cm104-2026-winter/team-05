<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>

        <form action="/calculate" method="post" class="calc-form">
            <input type="number" step="any" name="num1" placeholder="First number" required>

            <select name="op" required>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value=""></option>
                <option value="/">/</option>
            </select>

            <input type="number" step="any" name="num2" placeholder="Second number" required>

            <button type="submit">=</button>
        </form>

        {% if entries %}
            <div class="latest-result">
                Result: <strong>{{ entries[-1].result }}</strong>
            </div>
        {% endif %}

        <h2>History</h2>
        {% if entries %}
            <ul class="history-list">
                {% for entry in entries %}
                    <li>{{ entry.expression }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty-msg">No calculations yet.</p>
        {% endif %}
    </div>
</body>
</html>
